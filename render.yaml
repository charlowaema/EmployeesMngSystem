services:
  - type: web
    name: employee-management-system
    runtime: docker
    plan: free
    region: singapore

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        generateValue: true

      - key: DB_CONNECTION
        value: pgsql

      - key: DATABASE_URL
        fromDatabase:
          name: my-laravel-db
          property: connectionString

databases:
  - name: employee-management-db
    plan: free
    region: singapore